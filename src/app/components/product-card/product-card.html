<article class="product-card">
  <!-- Aquí se recibirá el producto por @Input -->
  <div class="product-card__media">
    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80" alt="Producto Nova Shop" />
    <span class="product-card__badge product-card__badge--offer">Oferta</span>
    <!-- Aquí se mostrará badge dinámico (Nuevo/Oferta) según @Input -->

    <button class="product-card__favorite" type="button" aria-label="Guardar en favoritos">
      <span class="material-symbols-rounded" aria-hidden="true">favorite</span>
      <!-- Aquí se emitirá evento favoritoToggle al padre con @Output -->
    </button>
  </div>

  <div class="product-card__body">
    <p class="product-card__category">Tecnología</p>
    <h3 class="product-card__name">Auriculares Nova Air Max</h3>
    <p class="product-card__price">79,99 €</p>
  </div>

  <button class="product-card__add" type="button">
    Añadir al carrito
    <!-- Aquí se emitirá evento addToCart al padre con @Output -->
  </button>
</article>
