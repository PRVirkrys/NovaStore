<section class="product-list" id="productos">
  <header class="product-list__header">
    <div>
      <p class="product-list__kicker">Colección destacada</p>
      <h2 class="product-list__title">Descubre productos para tu día a día</h2>
    </div>

    <div class="product-list__search" role="search">
      <span class="material-symbols-rounded" aria-hidden="true">search</span>
      <input type="text" placeholder="Buscar producto..." />
      <!-- Aquí se capturará el evento de búsqueda -->
      <!-- Aquí se conectará el filtro con servicio o estado compartido -->
    </div>
  </header>

  <div class="product-list__filters" role="group" aria-label="Filtros por categoría">
    <button class="product-list__filter product-list__filter--active" type="button">Todo</button>
    <button class="product-list__filter" type="button">Tecnología</button>
    <button class="product-list__filter" type="button">Hogar</button>
    <button class="product-list__filter" type="button">Accesorios</button>
    <button class="product-list__filter" type="button">Ofertas</button>
    <!-- Aquí se emitirán eventos al seleccionar categoría -->
    <!-- Aquí podrías renderizar categorías dinámicas con @for -->
  </div>

  <div class="product-list__grid">
    <!-- Aquí se renderizarán los productos con @for -->
    <!-- Aquí cada item pasará su información al hijo con @Input -->
    <app-product-card></app-product-card>
    <app-product-card></app-product-card>
    <app-product-card></app-product-card>
    <app-product-card></app-product-card>
    <app-product-card></app-product-card>
    <app-product-card></app-product-card>
    <!-- Aquí se escucharán eventos de app-product-card con @Output -->
  </div>
</section>
