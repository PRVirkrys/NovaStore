<div class="app-shell">
  <app-nav-bar (openCartEmitter)="openCart()"></app-nav-bar>

  <main class="app-shell__content">
    <section class="app-shell__hero">
      <div class="app-shell__hero-copy">
        <p class="app-shell__hero-kicker">Nova Shop</p>
        <h1>Diseño pensado para una experiencia de compra elegante</h1>
        <p>Interfaz de práctica preparada para conectar servicios, eventos, inputs y outputs.</p>
      </div>
      <div class="app-shell__hero-card">
        <p>Entrega en 24h</p>
        <strong>Compra segura y seguimiento en tiempo real</strong>
      </div>
    </section>

    <app-product-list></app-product-list>
    <app-favorite-section></app-favorite-section>

    <section class="app-shell__contact" id="contacto">
      <h2>Contacto</h2>
      <p>Soporte Nova Shop: soporte@novashop.dev</p>
    </section>
  </main>

  @if (cartIsOpen) {
    <app-cart-drawer (closeCartEmitter)="closeCart()"></app-cart-drawer>
  }

  <!-- Aquí se controlará visualmente abrir/cerrar el drawer desde estado global o del padre -->
</div>
